dataset:
  csv_path: "G:/downLoads/wind-turbine-scada-data-for-early-fault-detection.csv"
  processed_dir: "data/processed"
  reports_dir: "outputs/reports"
  chunk_size: 50000
  feature_columns:
    - "power_2_avg"
    - "power_2_std"
    - "power_5_avg"
    - "power_6_avg"
    - "wind_speed_235_avg"
    - "wind_speed_236_avg"
    - "reactive_power_119_avg"
    - "reactive_power_120_avg"
    - "sensor_41_avg"
    - "sensor_42_avg"
    - "power_wind_ratio"
    - "wind_speed_delta"
    - "reactive_power_gap"
    - "power_band"
    - "power_rolling_mean_3"
    - "power_rolling_std_3"
    - "power_delta_1"
  timestamp_column: "time_stamp"
  asset_id_column: "asset_id"
  split_column: "train_test"
  label_column: "status_type_id"
  split_train_value: "train"
  split_test_value: "prediction"
  healthy_label: 0
  anomaly_labels: [3, 4, 5]
  low_quantile: 0.001
  high_quantile: 0.999
  event_gap_minutes: 30
  min_required_columns:
    - "time_stamp"
    - "asset_id"
    - "train_test"
    - "status_type_id"
    - "power_2_avg"
    - "power_2_std"
    - "power_5_avg"
    - "power_6_avg"
    - "wind_speed_235_avg"
    - "wind_speed_236_avg"
    - "reactive_power_119_avg"
    - "reactive_power_120_avg"
    - "sensor_41_avg"
    - "sensor_42_avg"

training:
  contamination: 0.035
  random_state: 42
  n_estimators: 300
  max_samples: "auto"
  model_dir: "models"
  synthetic_eval_multiplier: 3.0
  synthetic_eval_seed: 123
  calibration_fraction: 0.2
  threshold_grid_size: 41
  aggregation_target_estimators: 400

federated:
  rounds: 1
  min_clients: 1
  server_address: "127.0.0.1:8081"
  global_model_path: "models/global/federated_isolation_forest.joblib"

inference:
  predictions_dir: "outputs/predictions"
  plots_dir: "outputs/plots"
  metrics_dir: "outputs/metrics"
  lambda_model_path: "models/global/federated_isolation_forest.joblib"
  sns_topic_arn: ""
  dashboard_dir: "outputs/dashboard"
  monitoring_dir: "outputs/monitoring"
